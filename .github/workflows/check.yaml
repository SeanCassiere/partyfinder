name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7
        with:
          repository: 9001/copyparty
          ref: e211aa26e536476f1423dc22b871780e18fd423a # v1.20.28
          path: work/copyparty
      - run: pip install jinja2
      - run: pnpm test
        env:
          COPYPARTY_SOURCE: ${{ github.workspace }}/work/copyparty
      - run: pnpm build
      - run: docker build --build-arg NODE_VERSION="$(cat .nvmrc)" -t partyfinder:test .
