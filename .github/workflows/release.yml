name: release

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    # Never execute a pull request's code in a workflow with publishing secrets.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check release prerequisites
        id: ready
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$TESTED_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "::notice::A newer commit is on main; its successful CI run will release it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::warning::Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets to enable Docker Hub releases."
            echo "Docker Hub publishing skipped: repository credentials are not configured. No release tag was created." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.ready.outputs.ready == 'true'
        uses: pnpm/action-setup@v6.0.8
      - name: Setup Node.js
        if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        if: steps.ready.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Login to Docker Hub
        if: steps.ready.outputs.ready == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create semantic release
        if: steps.ready.outputs.ready == 'true'
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs

      - name: Set up QEMU
        if: steps.semantic.outputs.released == 'true'
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        if: steps.semantic.outputs.released == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Build and push Docker image
        if: steps.semantic.outputs.released == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.semantic.outputs.version }}
            COMMIT_SHA=${{ github.event.workflow_run.head_sha }}
          tags: |
            seancassiere/partyfinder:${{ steps.semantic.outputs.version }}
            seancassiere/partyfinder:latest
