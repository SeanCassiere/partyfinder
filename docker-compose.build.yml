# Optional local build; the default deployment pulls the published Docker Hub image.
# NODE_VERSION="$(cat .nvmrc)" docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  partyfinder:
    build:
      context: .
      args:
        NODE_VERSION: ${NODE_VERSION:?Set NODE_VERSION from .nvmrc, e.g. NODE_VERSION="$(cat .nvmrc)"}
    image: partyfinder:local
    pull_policy: build
